[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orange-invest-errand-agent"
version = "2.0.0"
description = "Errand Agent Enterprise — Multi-Tenant Agentic SaaS Platform"
readme = "PRD.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "openai>=1.20.0",
    "tiktoken>=0.8.0",
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["errand-agent", "."]
testpaths = ["errand-agent/tests"]
addopts = "-v"
